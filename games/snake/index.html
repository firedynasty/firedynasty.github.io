<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidewinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Masthead, scoreboard strip, square board with menu overlays, touch pad, pickup key.
   Single dark look by design: a night pond with lime, sky and lavender snakes. */
:root {
  --bg: #0a1519;
  --panel: #101f25;
  --line: #22414b;
  --text: #e4efe9;
  --dim: #8aa7aa;
  --p1: #c6f25a;
  --p2: #62c8ff;
  --ai: #c58bff;
  --berry: #ff4466;
  --gold: #ffc93c;
  --wall: #ff6a4d;
  --display: 'Unbounded', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  font: 400 14px/1.5 var(--mono);
  padding-inline: 16px;
  padding-block: 20px 36px;
}
* { box-sizing: border-box; }
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { min-width: 0; }
h1 { margin: 0; font: 800 clamp(24px, 6vw, 34px)/1 var(--display); letter-spacing: -0.03em; }
.brand p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  font: 500 13px/1 var(--mono);
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 14px;
  cursor: pointer;
}
.btn:hover { border-color: var(--dim); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--p1); border-color: var(--p1); color: #0a1519; }
.btn.primary:hover { filter: brightness(1.08); }
.btn kbd { font: inherit; color: var(--dim); margin-left: 6px; }
:focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; }

.hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat .lbl { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.stat .val { font: 800 clamp(20px, 5vw, 26px)/1.1 var(--display); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

.fx { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; }
.chip { position: relative; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; background: var(--panel); overflow: hidden; }
.chip b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--dim); }
.chip u { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--text); opacity: .55; text-decoration: none; }

.stage { position: relative; width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #0c1a1f; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(7, 15, 18, .8); backdrop-filter: blur(4px); }
.panel { width: min(100%, 470px); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 2px; }
.panel h2 { margin: 0; font: 800 clamp(22px, 5vw, 30px)/1.1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.panel p { margin: 0; color: var(--dim); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.grp.wide { grid-column: 1 / -1; }
.grp.locked { opacity: .4; }
.grp.locked .seg button { cursor: not-allowed; }
.gl { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; min-width: 0; font: 500 13px/1 var(--mono); padding: 10px 6px; color: var(--dim); background: transparent; border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--text); color: #0a1519; }
.seg button:focus-visible { outline-offset: -2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.hs { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-variant-numeric: tabular-nums; }
.hs li { display: flex; gap: 8px; align-items: baseline; }
.hs li span { color: var(--dim); font-size: 12px; }
.hs li.hl b { color: var(--p1); }
.hs li.none { color: var(--dim); }
.badge { align-self: flex-start; background: var(--p1); color: #0a1519; font-size: 12px; padding: 4px 10px; border-radius: 4px; letter-spacing: .06em; text-transform: uppercase; }
.small { font-size: 12px; }

.count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font: 800 clamp(64px, 20vw, 130px)/1 var(--display); text-shadow: 0 6px 40px rgba(0, 0, 0, .7); }
.count.pop { animation: pop .45s ease-out; }
@keyframes pop { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; justify-content: center; }
.pad button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); display: grid; place-items: center; touch-action: none; }
.pad button:active { background: var(--line); }
.pad .u { grid-area: 1 / 2; } .pad .l { grid-area: 2 / 1; } .pad .r { grid-area: 2 / 3; } .pad .d { grid-area: 3 / 2; }
.pad svg { width: 24px; height: 24px; fill: currentColor; }
@media (pointer: coarse) { .pad { display: grid; } }

.legend h2 { margin: 6px 0 10px; font: 500 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.key { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px 20px; }
.key li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--dim); min-width: 0; }
.key li svg { flex: none; width: 24px; height: 24px; margin-top: 1px; }
.key li b { color: var(--text); font-weight: 500; display: block; }

@media (max-width: 520px) {
  .panel { gap: 10px; }
  .opts { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { .count.pop { animation: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Sidewinder</h1>
      <p>Eat, grow, outlast the rest.</p>
    </div>
    <div class="tools">
      <button class="btn" id="btn-pause" type="button">Pause<kbd>P</kbd></button>
      <button class="btn" id="btn-sound" type="button">Sound on</button>
    </div>
  </header>

  <section class="hud" id="hud" aria-label="Scores"></section>
  <div class="fx" id="fx" aria-label="Active pickups"></div>

  <div class="stage" id="stage">
    <canvas id="board" aria-label="Game board"></canvas>
    <div class="count" id="count" hidden>3</div>

    <div class="overlay" id="overlay">
      <section class="panel" id="p-menu" aria-label="New game">
        <h2>Sidewinder</h2>
        <div class="opts">
          <div class="grp wide">
            <span class="gl">Style</span>
            <div class="seg" role="radiogroup" aria-label="Style">
              <button type="button" role="radio" id="opt-easy-off" data-k="easy" data-v="off">Classic</button>
              <button type="button" role="radio" id="opt-easy-on" data-k="easy" data-v="on">Easy (kids)</button>
            </div>
          </div>
          <div class="grp wide">
            <span class="gl">Mode</span>
            <div class="seg" role="radiogroup" aria-label="Mode">
              <button type="button" role="radio" id="opt-mode-solo" data-k="mode" data-v="solo">Solo</button>
              <button type="button" role="radio" id="opt-mode-ai" data-k="mode" data-v="ai">vs Ember</button>
              <button type="button" role="radio" id="opt-mode-duo" data-k="mode" data-v="duo">2 Players</button>
            </div>
          </div>
          <div class="grp" id="g-edges">
            <span class="gl">Edges</span>
            <div class="seg" role="radiogroup" aria-label="Edges">
              <button type="button" role="radio" id="opt-edges-walls" data-k="edges" data-v="walls">Walls</button>
              <button type="button" role="radio" id="opt-edges-wrap" data-k="edges" data-v="wrap">Wrap</button>
            </div>
          </div>
          <div class="grp" id="g-rocks">
            <span class="gl">Rocks</span>
            <div class="seg" role="radiogroup" aria-label="Rocks">
              <button type="button" role="radio" id="opt-rocks-off" data-k="rocks" data-v="off">Off</button>
              <button type="button" role="radio" id="opt-rocks-on" data-k="rocks" data-v="on">On</button>
            </div>
          </div>
          <div class="grp wide" id="g-speed">
            <span class="gl">Speed</span>
            <div class="seg" role="radiogroup" aria-label="Speed">
              <button type="button" role="radio" id="opt-speed-chill" data-k="speed" data-v="chill">Chill</button>
              <button type="button" role="radio" id="opt-speed-normal" data-k="speed" data-v="normal">Normal</button>
              <button type="button" role="radio" id="opt-speed-fast" data-k="speed" data-v="fast">Fast</button>
            </div>
          </div>
        </div>
        <div class="grp">
          <span class="gl" id="menu-hs-title">Top scores</span>
          <ol class="hs" id="menu-hs"></ol>
        </div>
        <div class="row"><button class="btn primary" id="btn-start" type="button">Start game</button></div>
        <p class="small" id="hint-keys"></p>
      </section>

      <section class="panel" id="p-pause" aria-label="Paused" hidden>
        <h2>Paused</h2>
        <div class="row">
          <button class="btn primary" id="btn-resume" type="button">Resume</button>
          <button class="btn" id="btn-restart" type="button">Restart</button>
          <button class="btn" id="btn-menu-a" type="button">Menu</button>
        </div>
      </section>

      <section class="panel" id="p-over" aria-label="Round over" hidden>
        <span class="badge" id="over-badge" hidden>New high score</span>
        <h2 id="over-title">Game over</h2>
        <p id="over-sub"></p>
        <div class="grp" id="over-hs-wrap">
          <span class="gl" id="over-hs-title">Top scores</span>
          <ol class="hs" id="over-hs"></ol>
        </div>
        <div class="row">
          <button class="btn primary" id="btn-again" type="button">Play again</button>
          <button class="btn" id="btn-menu-b" type="button">Menu</button>
        </div>
      </section>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="Touch controls">
    <button type="button" class="u" data-d="0" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 6l8 13H4z"/></svg></button>
    <button type="button" class="l" data-d="3" aria-label="Left"><svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><path d="M12 6l8 13H4z"/></svg></button>
    <button type="button" class="r" data-d="1" aria-label="Right"><svg viewBox="0 0 24 24" style="transform:rotate(90deg)"><path d="M12 6l8 13H4z"/></svg></button>
    <button type="button" class="d" data-d="2" aria-label="Down"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 6l8 13H4z"/></svg></button>
  </div>

  <section class="legend">
    <h2>Pickups</h2>
    <ul class="key" id="key"></ul>
  </section>
</div>

<script>
(() => {
'use strict';

const COLS = 26, ROWS = 26;
const $ = (s) => document.querySelector(s);
const cv = $('#board'), ctx = cv.getContext('2d'), stage = $('#stage');
const bg = document.createElement('canvas');
const hudEl = $('#hud'), fxEl = $('#fx'), countEl = $('#count'), ov = $('#overlay');
const panels = { menu: $('#p-menu'), pause: $('#p-pause'), over: $('#p-over') };

const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const COLORS = { p1: '#c6f25a', p2: '#62c8ff', ai: '#c58bff' };
const MODE_LABEL = { solo: 'Solo', ai: 'vs Ember', duo: '2 Players' };
const EDGE_LABEL = { walls: 'Walls', wrap: 'Wrap-around' };
const SPEED_BASE = { chill: 0.15, normal: 0.11, fast: 0.08 };
const POWER = {
  boost:  { name: 'Boost',  color: '#ffd23c', dur: 6, desc: 'Move faster for 6 seconds.' },
  slow:   { name: 'Frost',  color: '#8fe3ff', dur: 6, desc: 'Slows your rivals for 6 seconds. Alone, it slows you.' },
  shrink: { name: 'Trim',   color: '#ff9ad5', dur: 0, desc: 'Cuts your length in half, down to 4 at least.' },
  ghost:  { name: 'Ghost',  color: '#d7d7ff', dur: 5, desc: 'Pass through walls, rocks and snakes for 5 seconds.' },
  double: { name: 'Double', color: '#7dffb1', dur: 8, desc: 'Every point counts twice for 8 seconds.' },
};
const POWER_KEYS = Object.keys(POWER);
const ICONS = {
  boost:  { d: 'M13 2 4 14h6l-1 8 9-12h-6z', mode: 'fill' },
  slow:   { d: 'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9', mode: 'stroke' },
  shrink: { d: 'M3 12h7M21 12h-7M7 8l3.2 4L7 16M17 8l-3.2 4 3.2 4', mode: 'stroke' },
  ghost:  { d: 'M12 3a7 7 0 0 0-7 7v11l3.5-2.5L12 21l3.5-2.5L19 21V10a7 7 0 0 0-7-7zM9.5 9.3a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zM14.5 9.3a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z', mode: 'fill', rule: 'evenodd' },
  double: { text: '2×', mode: 'text' },
  gold:   { d: 'M12 2l3 6.5 7 .8-5.2 4.7 1.5 7L12 17.3 5.7 21l1.5-7L2 9.3l7-.8z', mode: 'fill' },
};
for (const k in ICONS) if (ICONS[k].d) ICONS[k].p = new Path2D(ICONS[k].d);

/* ---------- settings and scores (per-viewer, best effort) ---------- */
const cfg = { mode: 'solo', edges: 'walls', speed: 'normal', rocks: 'off', mute: false };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('sidewinder.settings') || '{}')); } catch (e) {}
if (!MODE_LABEL[cfg.mode]) cfg.mode = 'solo';
if (!EDGE_LABEL[cfg.edges]) cfg.edges = 'walls';
if (!SPEED_BASE[cfg.speed]) cfg.speed = 'normal';
if (cfg.rocks !== 'on') cfg.rocks = 'off';
if (cfg.easy !== 'on') cfg.easy = 'off';
// Easy (kids) forces wrap-around edges, no rocks, a slower snake and no Boost.
const easy = () => cfg.easy === 'on';
const edgesNow = () => (easy() ? 'wrap' : cfg.edges);
cfg.mute = !!cfg.mute;
const saveCfg = () => { try { localStorage.setItem('sidewinder.settings', JSON.stringify(cfg)); } catch (e) {} };
const scoreKey = () => 'sidewinder.scores.' + cfg.mode + '.' + edgesNow() + (easy() ? '.easy' : '');
function loadScores() {
  try {
    const a = JSON.parse(localStorage.getItem(scoreKey()) || '[]');
    return Array.isArray(a) ? a.filter((n) => typeof n === 'number').slice(0, 5) : [];
  } catch (e) { return []; }
}
function saveScore(v) {
  if (v <= 0) return -1;
  const list = loadScores();
  list.push(v);
  list.sort((a, b) => b - a);
  const rank = list.indexOf(v);
  try { localStorage.setItem(scoreKey(), JSON.stringify(list.slice(0, 5))); } catch (e) {}
  return rank < 5 ? rank : -1;
}

/* ---------- audio ---------- */
let ac = null;
function audio() {
  if (!ac) { try { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, d, type, vol, to, delay) {
  if (cfg.mute) return;
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function sfx(k) {
  switch (k) {
    case 'eat': tone(520, 0.09, 'triangle', 0.08, 780); break;
    case 'gold': tone(660, 0.1, 'triangle', 0.08); tone(880, 0.1, 'triangle', 0.08, 0, 0.08); tone(1320, 0.18, 'triangle', 0.08, 0, 0.16); break;
    case 'power': tone(300, 0.26, 'square', 0.035, 950); break;
    case 'shrink': tone(720, 0.22, 'square', 0.035, 260); break;
    case 'die': tone(240, 0.55, 'sawtooth', 0.08, 45); break;
    case 'beep': tone(520, 0.12, 'sine', 0.06); break;
    case 'go': tone(880, 0.28, 'sine', 0.07); break;
    case 'level': tone(440, 0.1, 'triangle', 0.07); tone(660, 0.16, 'triangle', 0.07, 0, 0.1); break;
    case 'win': tone(523, 0.12, 'triangle', 0.08); tone(659, 0.12, 'triangle', 0.08, 0, 0.12); tone(784, 0.24, 'triangle', 0.08, 0, 0.24); break;
  }
}

/* ---------- helpers ---------- */
const rnd = (n) => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => [(a[0] + (b[0] - a[0]) * t) | 0, (a[1] + (b[1] - a[1]) * t) | 0, (a[2] + (b[2] - a[2]) * t) | 0];
const rgb = (a) => 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';

/* ---------- game state ---------- */
let snakes = [], items = [], rocks = [], particles = [], pops = [];
let state = 'menu';            // menu | count | play | paused | ending | over
let level = 1, eaten = 0, spawnT = 8, shake = 0, endT = 0, countT = 0, goT = 0, lastCount = 0;
let clock = 0, gt = 0, roundOver = false, bestSaved = 0;
let wins = { a: 0, b: 0 }, hudCache = '';

function makeSnake(id, name, color, ctrl, x, y, dir) {
  const body = [];
  for (let i = 0; i < 4; i++) body.push({ x: x - DIRS[dir][0] * i, y: y - DIRS[dir][1] * i });
  return {
    id, name, color, rgb: hex2rgb(color), ctrl, body, prev: body.map((p) => ({ x: p.x, y: p.y })),
    dir, queue: [], grow: 0, score: 0, alive: true, acc: 0, eaten: 0, tongue: Math.random() * 6,
    fx: { boost: 0, slow: 0, ghost: 0, double: 0 },
  };
}

function newRound() {
  level = 1; eaten = 0; shake = 0; gt = 0; roundOver = false; spawnT = rand(6, 9);
  items = []; rocks = []; particles = []; pops = [];
  if (cfg.mode === 'solo') {
    snakes = [makeSnake(0, 'You', COLORS.p1, 'p1', 8, 13, 1)];
  } else if (cfg.mode === 'ai') {
    snakes = [makeSnake(0, 'You', COLORS.p1, 'p1', 6, 8, 1), makeSnake(1, 'Ember', COLORS.ai, 'ai', 19, 17, 3)];
  } else {
    snakes = [makeSnake(0, 'P1', COLORS.p1, 'p1', 6, 8, 1), makeSnake(1, 'P2', COLORS.p2, 'p2', 19, 17, 3)];
  }
  for (let i = 0; i < (cfg.mode === 'solo' ? 1 : 2); i++) spawnItem('apple');
}

function occupied(x, y) {
  for (const s of snakes) for (const p of s.body) if (p.x === x && p.y === y) return true;
  for (const r of rocks) if (r.x === x && r.y === y) return true;
  for (const it of items) if (it.x === x && it.y === y) return true;
  return false;
}
function freeCell(minHead) {
  for (let t = 0; t < 300; t++) {
    const x = rnd(COLS), y = rnd(ROWS);
    if (occupied(x, y)) continue;
    let ok = true;
    for (const s of snakes) { const h = s.body[0]; if (Math.abs(h.x - x) + Math.abs(h.y - y) < minHead) { ok = false; break; } }
    if (ok) return { x, y };
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied(x, y)) return { x, y };
  return null;
}
const TTL = { gold: 8, boost: 11, slow: 11, shrink: 11, ghost: 11, double: 11 };
function spawnItem(type) {
  const c = freeCell(type === 'apple' ? 2 : 4);
  if (c) items.push({ type, x: c.x, y: c.y, born: gt, ttl: TTL[type] || Infinity });
}

function interval(s) {
  let base;
  if (easy()) base = Math.max(0.14, 0.21 * Math.pow(0.985, level - 1));
  else base = Math.max(0.05, SPEED_BASE[cfg.speed] * Math.pow(0.965, level - 1));
  let f = 1;
  if (s.fx.boost > 0) f *= 0.62;
  if (s.fx.slow > 0) f *= 1.75;
  return base * f;
}

/* ---------- effects ---------- */
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (0.4 + Math.random()) * (speed || 3);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.4 + Math.random() * 0.4, color, size: 0.06 + Math.random() * 0.1 });
  }
}
function pop(x, y, text, color, big) { pops.push({ x, y, t: 0, text, color, big: !!big }); }
function updateParticles(dt) {
  const fr = Math.pow(0.03, dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= fr; p.vy *= fr;
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].t += dt;
    if (pops[i].t > 0.95) pops.splice(i, 1);
  }
}

/* ---------- rules ---------- */
function turn(s, d) {
  const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
  if (d === last || d === (last + 2) % 4) return;
  if (s.queue.length < 2) s.queue.push(d);
}
function die(s) {
  s.alive = false; roundOver = true; shake = 0.45; sfx('die');
  for (const p of s.body) burst(p.x + 0.5, p.y + 0.5, s.color, 3, 4);
}
function award(s, n) { const v = n * (s.fx.double > 0 ? 2 : 1); s.score += v; return v; }

function eatItem(s, it) {
  const cx = it.x + 0.5, cy = it.y + 0.5;
  if (it.type === 'apple') {
    s.grow += 1; eaten++; s.eaten++;
    pop(cx, cy, '+' + award(s, 10), s.color); burst(cx, cy, '#ff4466', 10); sfx('eat');
  } else if (it.type === 'gold') {
    s.grow += 3; eaten += 2; s.eaten++;
    pop(cx, cy, '+' + award(s, 50), '#ffc93c'); burst(cx, cy, '#ffc93c', 18, 4); sfx('gold');
  } else {
    const P = POWER[it.type];
    pop(cx, cy, P.name, P.color); burst(cx, cy, P.color, 14, 3.5); sfx(it.type === 'shrink' ? 'shrink' : 'power');
    if (it.type === 'boost') s.fx.boost = P.dur;
    else if (it.type === 'ghost') s.fx.ghost = P.dur;
    else if (it.type === 'double') s.fx.double = P.dur;
    else if (it.type === 'slow') {
      const others = snakes.filter((o) => o !== s && o.alive);
      for (const o of (others.length ? others : [s])) o.fx.slow = P.dur;
    } else if (it.type === 'shrink') {
      const keep = Math.max(4, Math.ceil(s.body.length / 2));
      const cut = s.body.splice(keep);
      for (const p of cut) burst(p.x + 0.5, p.y + 0.5, s.color, 2, 2.5);
      s.grow = 0; award(s, 15);
    }
  }
  const nl = 1 + Math.floor(eaten / 6);
  if (nl > level) { level = nl; onLevelUp(); }
}
function onLevelUp() {
  sfx('level');
  pop(COLS / 2, 3, 'Level ' + level, '#e4efe9', true);
  if (cfg.rocks === 'on' && !easy()) {
    const add = cfg.mode === 'solo' ? 2 : 1;
    for (let i = 0; i < add && rocks.length < 14; i++) { const c = freeCell(6); if (c) rocks.push(c); }
  }
}

function step(s) {
  if (s.ctrl === 'ai') aiThink(s);
  else if (s.queue.length) { const d = s.queue.shift(); if (d !== (s.dir + 2) % 4) s.dir = d; }
  const head = s.body[0], v = DIRS[s.dir];
  let nx = head.x + v[0], ny = head.y + v[1];
  const ghost = s.fx.ghost > 0;
  if (edgesNow() === 'wrap' || ghost) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { die(s); return; }
  if (!ghost) {
    if (rocks.some((r) => r.x === nx && r.y === ny)) { die(s); return; }
    for (const o of snakes) {
      if (!o.alive || (o !== s && o.fx.ghost > 0)) continue;
      const lim = (o === s && s.grow === 0) ? o.body.length - 1 : o.body.length;
      for (let i = 0; i < lim; i++) if (o.body[i].x === nx && o.body[i].y === ny) { die(s); return; }
    }
  }
  s.prev = s.body.map((p) => ({ x: p.x, y: p.y }));
  s.body.unshift({ x: nx, y: ny });
  if (s.grow > 0) s.grow--; else s.body.pop();
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.x === nx && it.y === ny) { items.splice(i, 1); eatItem(s, it); }
  }
}

/* ---------- the rival ---------- */
function nbr(x, y, d) {
  let nx = x + DIRS[d][0], ny = y + DIRS[d][1];
  if (edgesNow() === 'wrap') { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return -1;
  return nx + ny * COLS;
}
function blockedGrid(me) {
  const g = new Uint8Array(COLS * ROWS);
  for (const r of rocks) g[r.x + r.y * COLS] = 1;
  for (const o of snakes) {
    if (!o.alive || (o !== me && o.fx.ghost > 0)) continue;
    const lim = (o === me && me.grow === 0) ? o.body.length - 1 : o.body.length;
    for (let i = 0; i < lim; i++) g[o.body[i].x + o.body[i].y * COLS] = 1;
  }
  return g;
}
function floodArea(start, g, limit) {
  const seen = new Uint8Array(COLS * ROWS);
  const q = [start]; seen[start] = 1;
  for (let qi = 0; qi < q.length && q.length < limit; qi++) {
    const cur = q[qi], cx = cur % COLS, cy = (cur / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const ni = nbr(cx, cy, d);
      if (ni < 0 || g[ni] || seen[ni]) continue;
      seen[ni] = 1; q.push(ni);
    }
  }
  return q.length;
}
function aiThink(s) {
  const g = blockedGrid(s);
  const danger = new Uint8Array(COLS * ROWS);
  for (const o of snakes) {
    if (o === s || !o.alive) continue;
    const h = o.body[0];
    for (let d = 0; d < 4; d++) { const i = nbr(h.x, h.y, d); if (i >= 0) danger[i] = 1; }
  }
  const head = s.body[0];
  const cand = [];
  for (const rel of [0, 1, 3]) {
    const d = (s.dir + rel) % 4, i = nbr(head.x, head.y, d);
    if (i < 0 || g[i]) continue;
    cand.push({ d, i, rel });
  }
  if (!cand.length) return;
  const dist = new Int16Array(COLS * ROWS).fill(-1), first = new Int8Array(COLS * ROWS).fill(-1);
  const q = [];
  for (const c of cand) { dist[c.i] = 1; first[c.i] = c.d; q.push(c.i); }
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi], cx = cur % COLS, cy = (cur / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const ni = nbr(cx, cy, d);
      if (ni < 0 || g[ni] || dist[ni] >= 0) continue;
      dist[ni] = dist[cur] + 1; first[ni] = first[cur]; q.push(ni);
    }
  }
  let want = -1, bs = 1e9;
  const iv = interval(s);
  for (const it of items) {
    const i = it.x + it.y * COLS;
    if (dist[i] < 0) continue;
    if (isFinite(it.ttl) && (it.ttl - (gt - it.born)) < dist[i] * iv) continue;
    const sc = dist[i] * (it.type === 'apple' ? 1 : it.type === 'gold' ? 0.6 : 0.9);
    if (sc < bs) { bs = sc; want = first[i]; }
  }
  const need = Math.min(s.body.length + 3, 60);
  for (const c of cand) { c.area = floodArea(c.i, g, need + 4); c.danger = danger[c.i]; }
  let pick = null;
  if (want >= 0) { const c = cand.find((k) => k.d === want); if (c && c.area >= need && !c.danger) pick = c; }
  if (!pick) {
    const byArea = (a, b) => (Math.min(b.area, need) - Math.min(a.area, need)) || (a.rel - b.rel);
    const safe = cand.filter((c) => c.area >= need && !c.danger).sort(byArea);
    const calm = cand.filter((c) => !c.danger).sort((a, b) => (b.area - a.area) || (a.rel - b.rel));
    pick = safe[0] || calm[0] || cand.slice().sort((a, b) => b.area - a.area)[0];
  }
  s.dir = pick.d;
}

/* ---------- round flow ---------- */
function updatePlay(dt) {
  gt += dt;
  for (const s of snakes) {
    if (!s.alive) continue;
    for (const k in s.fx) if (s.fx[k] > 0) s.fx[k] = Math.max(0, s.fx[k] - dt);
    s.acc += dt;
    let iv = interval(s), guard = 0;
    while (s.alive && s.acc >= iv && guard++ < 4) { s.acc -= iv; step(s); iv = interval(s); }
    if (s.acc > iv) s.acc = iv;
    if (s.alive && s.fx.boost > 0 && Math.random() < 0.6) {
      const t = s.body[s.body.length - 1];
      burst(t.x + 0.5, t.y + 0.5, '#ffd23c', 1, 0.8);
    }
  }
  items = items.filter((it) => gt - it.born < it.ttl);
  const minApples = cfg.mode === 'solo' ? 1 : 2;
  if (items.filter((i) => i.type === 'apple').length < minApples) spawnItem('apple');
  if (Math.random() < dt * 0.035 && !items.some((i) => i.type === 'gold')) spawnItem('gold');
  spawnT -= dt;
  if (spawnT <= 0) {
    if (items.filter((i) => POWER[i.type]).length < 2) {
      const pool = easy() ? POWER_KEYS.filter((k) => k !== 'boost') : POWER_KEYS;
      spawnItem(pool[rnd(pool.length)]);
    }
    spawnT = rand(7, 12);
  }
  if (roundOver) { roundOver = false; state = 'ending'; endT = 1.0; }
}

function startGame() {
  audio();
  newRound();
  showPanel(null);
  state = 'count'; countT = 3; lastCount = 99;
  countEl.hidden = false;
}
function setCount(txt) {
  countEl.textContent = txt;
  countEl.classList.remove('pop'); void countEl.offsetWidth; countEl.classList.add('pop');
}
function pause() {
  if (state !== 'play') return;
  state = 'paused'; showPanel('pause'); if (document.activeElement) document.activeElement.blur();
}
function resume() {
  if (state !== 'paused') return;
  showPanel(null); state = 'count'; countT = 1; lastCount = 99; countEl.hidden = false;
}
function toggleMute() {
  cfg.mute = !cfg.mute; saveCfg(); $('#btn-sound').textContent = cfg.mute ? 'Sound off' : 'Sound on';
}
function showPanel(name) {
  ov.hidden = !name;
  for (const k in panels) panels[k].hidden = (k !== name);
}
function showMenu() {

  refreshMenu(); showPanel('menu'); $('#btn-start').focus();
}

function renderScores(ul, title, hl) {

  const list = loadScores();
  title.textContent = 'Top scores · ' + MODE_LABEL[cfg.mode] + ' · ' + EDGE_LABEL[edgesNow()] + (easy() ? ' · Easy' : '');
  ul.innerHTML = list.length
    ? list.map((v, i) => '<li' + (i === hl ? ' class="hl"' : '') + '><span>' + (i + 1) + '</span><b>' + v + '</b></li>').join('')
    : '<li class="none">No scores yet</li>';

}
let menuMode = null;
function refreshMenu() {
  document.querySelectorAll('.seg button').forEach((b) => {
    const on = cfg[b.dataset.k] === b.dataset.v;
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.classList.toggle('on', on);
  });
  for (const k of ['edges', 'rocks', 'speed']) {

    grp.classList.toggle('locked', easy());

  }
  const keys = cfg.mode === 'duo'
    ? 'P1 steers with WASD, P2 with the arrow keys. Enter, Space or P pauses.'
    : 'Steer with the arrow keys or WASD, or swipe the board. Enter, Space or P pauses.';
  $('#hint-keys').textContent = easy()
    ? 'Easy: a slower snake, no wall crashes (you come out the other side), no rocks and no speed boost. ' + keys
    : keys;
  renderScores($('#menu-hs'), $('#menu-hs-title'));
  bestSaved = loadScores()[0] || 0;
  if (menuMode !== cfg.mode) { wins = { a: 0, b: 0 }; menuMode = cfg.mode; }

}

function showOver() {
  state = 'over';
  const [a, b] = snakes;
  let title = 'Game over', sub = '', rank = -1, win = false;
  if (cfg.mode === 'solo') {
    if (easy()) title = 'Nice try!';
    sub = 'Score ' + a.score + ' · Length ' + a.body.length + ' · Level ' + level;
    rank = saveScore(a.score);
  } else {
    let w = null;
    if (a.alive && !b.alive) w = a; else if (b.alive && !a.alive) w = b;
    if (w) {
      title = (w.ctrl === 'p1' && cfg.mode === 'ai') ? 'You win' : w.name + ' wins';
      if (w === a) wins.a++; else wins.b++;
      win = (cfg.mode === 'ai') ? w === a : true;
    } else title = 'Draw';
    sub = a.name + ' ' + a.score + ' · ' + b.name + ' ' + b.score + ' · Wins ' + wins.a + ' – ' + wins.b;
    if (cfg.mode === 'ai') rank = saveScore(a.score);
  }
  $('#over-title').textContent = title;
  $('#over-sub').textContent = sub;
  $('#over-badge').hidden = rank !== 0;
  $('#over-hs-wrap').hidden = !renderScores($('#over-hs'), $('#over-hs-title'), rank);
  if (rank === 0 || win) sfx('win');
  bestSaved = loadScores()[0] || bestSaved;
  showPanel('over'); $('#btn-again').focus();
}

/* ---------- input ---------- */
const KEYS_ARROWS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
const KEYS_WASD = { KeyW: 0, KeyD: 1, KeyS: 2, KeyA: 3 };
function human(idx, d) {
  const s = snakes[idx];
  if (s && s.alive && (state === 'play' || state === 'count')) turn(s, d);
}
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.code;
  const onBtn = e.target && e.target.tagName === 'BUTTON';
  if (c in KEYS_ARROWS || c in KEYS_WASD) {
    if (c in KEYS_ARROWS && (state === 'play' || state === 'count')) e.preventDefault();
    if (cfg.mode === 'duo') {
      if (c in KEYS_WASD) human(0, KEYS_WASD[c]);
      else human(1, KEYS_ARROWS[c]);
    } else human(0, c in KEYS_ARROWS ? KEYS_ARROWS[c] : KEYS_WASD[c]);
    return;
  }
  if (c === 'KeyM') { toggleMute(); return; }
  if (c === 'KeyP' || c === 'Escape') {
    if (state === 'play') { pause(); e.preventDefault(); }
    else if (state === 'paused') { resume(); e.preventDefault(); }
    else if (state === 'over' && c === 'Escape') showMenu();
    return;
  }
  if (c === 'Enter' && (state === 'play' || state === 'paused')) {
    e.preventDefault();
    if (state === 'play') pause(); else resume();
    return;
  }
  if ((c === 'Space' || c === 'Enter') && !onBtn) {
    if (c === 'Space') e.preventDefault();
    if (state === 'play') pause();
    else if (state === 'paused') resume();
    else if (state === 'over' || state === 'menu') startGame();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pause(); });

let sw = null;
cv.addEventListener('pointerdown', (e) => { sw = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', (e) => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) > 22) {
    human(0, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    sw = { x: e.clientX, y: e.clientY };
  }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => cv.addEventListener(n, () => { sw = null; }));
document.querySelectorAll('#pad button').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); human(0, +b.dataset.d); }));

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  cfg[b.dataset.k] = b.dataset.v; saveCfg(); refreshMenu();
}));
$('#btn-start').addEventListener('click', startGame);
$('#btn-again').addEventListener('click', startGame);
$('#btn-restart').addEventListener('click', startGame);
$('#btn-resume').addEventListener('click', resume);
$('#btn-menu-a').addEventListener('click', showMenu);
$('#btn-menu-b').addEventListener('click', showMenu);
$('#btn-pause').addEventListener('click', (e) => { e.currentTarget.blur(); if (state === 'play') pause(); else if (state === 'paused') resume(); });
$('#btn-sound').addEventListener('click', (e) => { e.currentTarget.blur(); toggleMute(); });

/* ---------- HUD ---------- */
function stat(l, v, sub, color) {
  return '<div class="stat"><div class="lbl">' + (color ? '<i class="dot" style="background:' + color + '"></i>' : '') + l + '</div><div class="val">' + v + '</div><div class="sub">' + sub + '</div></div>';
}
function updateHud() {
  const parts = [];
  if (cfg.mode === 'solo') {
    const s = snakes[0];
    parts.push(stat('You', s.score, 'length ' + s.body.length, s.color));
    parts.push(stat('Best', Math.max(bestSaved, s.score), easy() ? 'Easy' : EDGE_LABEL[edgesNow()]));
    parts.push(stat('Level', level, eaten + ' eaten'));
  } else {
    for (const s of snakes) parts.push(stat(s.name, s.score, 'length ' + s.body.length, s.color));
    parts.push(stat('Level', level, eaten + ' eaten'));
    parts.push(stat('Wins', wins.a + ' – ' + wins.b, snakes[0].name + ' vs ' + snakes[1].name));
  }
  const html = parts.join('');
  if (html !== hudCache) { hudEl.innerHTML = html; hudCache = html; }
}
const fxEls = new Map();
function syncFx() {
  const live = new Set();
  for (const s of snakes) {
    for (const k in s.fx) {
      const v = s.fx[k];
      if (v <= 0 || !s.alive) continue;
      const key = s.id + k; live.add(key);
      let el = fxEls.get(key);
      if (!el) {
        el = document.createElement('div'); el.className = 'chip';
        el.innerHTML = '<i class="dot" style="background:' + s.color + '"></i><span>' + (snakes.length > 1 ? s.name + ' · ' : '') + POWER[k].name + '</span><b></b><u></u>';
        fxEl.appendChild(el); fxEls.set(key, el);
        el._b = el.querySelector('b'); el._u = el.querySelector('u');
      }
      el._b.textContent = v.toFixed(1) + 's';
      el._u.style.width = Math.min(100, v / POWER[k].dur * 100) + '%';
    }
  }
  for (const [key, el] of fxEls) if (!live.has(key)) { el.remove(); fxEls.delete(key); }
}

/* ---------- drawing ---------- */
let cs = 20;
const rr = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };

function buildBg() {
  const W = cv.width; if (!W) return;
  cs = W / COLS; bg.width = bg.height = W;
  const b = bg.getContext('2d');
  b.fillStyle = '#0c1a1f'; b.fillRect(0, 0, W, W);
  b.fillStyle = 'rgba(120,200,190,.035)';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) & 1) b.fillRect(x * cs, y * cs, cs, cs);
  const g = b.createRadialGradient(W / 2, W / 2, W * 0.2, W / 2, W / 2, W * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');
  b.fillStyle = g; b.fillRect(0, 0, W, W);
  if (edgesNow() === 'walls') {
    b.strokeStyle = '#ff6a4d'; b.globalAlpha = 0.85; b.lineWidth = Math.max(2, cs * 0.14);
    b.strokeRect(b.lineWidth / 2, b.lineWidth / 2, W - b.lineWidth, W - b.lineWidth);
  } else {
    b.strokeStyle = '#62c8ff'; b.globalAlpha = 0.5; b.lineWidth = Math.max(2, cs * 0.07);
    b.setLineDash([cs * 0.3, cs * 0.3]);
    b.strokeRect(b.lineWidth / 2, b.lineWidth / 2, W - b.lineWidth, W - b.lineWidth);
  }
}
function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.floor((r.width * dpr) / COLS) * COLS;
  if (px > 0 && px !== cv.width) { cv.width = cv.height = px; buildBg(); }
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

function drawIcon(t, cx, cy, sz, color) {
  const ic = ICONS[t];
  ctx.save();
  ctx.translate(cx - sz / 2, cy - sz / 2); ctx.scale(sz / 24, sz / 24);
  if (ic.mode === 'text') {
    ctx.fillStyle = color; ctx.font = "800 13px 'Unbounded', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ic.text, 12, 13);
  } else if (ic.mode === 'stroke') {
    ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(ic.p);
  } else { ctx.fillStyle = color; ctx.fill(ic.p, ic.rule || 'nonzero'); }
  ctx.restore();
}

function drawRock(r) {
  const x = r.x * cs + cs * 0.08, y = r.y * cs + cs * 0.08, w = cs * 0.84;
  ctx.fillStyle = '#1b2e35'; rr(x, y + cs * 0.06, w, w, cs * 0.2); ctx.fill();
  ctx.fillStyle = '#35525c'; rr(x, y, w, w * 0.92, cs * 0.2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(x + cs * 0.1, y + cs * 0.08, w * 0.5, w * 0.14, cs * 0.06); ctx.fill();
}

function drawItem(it) {
  const cx = (it.x + 0.5) * cs, cy = (it.y + 0.5) * cs + Math.sin(clock * 4 + it.x * 1.7) * cs * 0.04;
  const left = it.ttl - (gt - it.born);
  ctx.save();
  if (isFinite(left) && left < 3 && Math.floor(clock * 6) % 2 === 0) ctx.globalAlpha = 0.4;
  if (it.type === 'apple') {
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(cx, cy + cs * 0.3, cs * 0.28, cs * 0.09, 0, 0, 6.283); ctx.fill();
    const g = ctx.createRadialGradient(cx - cs * 0.1, cy - cs * 0.12, cs * 0.04, cx, cy, cs * 0.4);
    g.addColorStop(0, '#ff8aa0'); g.addColorStop(1, '#e02a4d');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.34, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = cs * 0.05; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy - cs * 0.3); ctx.lineTo(cx + cs * 0.04, cy - cs * 0.44); ctx.stroke();
    ctx.fillStyle = '#7fd35b'; ctx.beginPath(); ctx.ellipse(cx + cs * 0.14, cy - cs * 0.4, cs * 0.12, cs * 0.06, -0.5, 0, 6.283); ctx.fill();
  } else if (it.type === 'gold') {
    const g = ctx.createRadialGradient(cx, cy, cs * 0.1, cx, cy, cs * 0.75);
    g.addColorStop(0, 'rgba(255,201,60,.5)'); g.addColorStop(1, 'rgba(255,201,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.75, 0, 6.283); ctx.fill();
    drawIcon('gold', cx, cy, cs * 0.95, '#ffc93c');
  } else {
    const P = POWER[it.type];
    ctx.fillStyle = '#0d1d23'; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.42, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = cs * 0.07; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.42, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = P.color; ctx.lineWidth = cs * 0.07; ctx.lineCap = 'round';
    const frac = Math.max(0, Math.min(1, left / it.ttl));
    ctx.beginPath(); ctx.arc(cx, cy, cs * 0.42, -Math.PI / 2, -Math.PI / 2 + 6.283 * frac); ctx.stroke();
    drawIcon(it.type, cx, cy, cs * 0.5, P.color);
  }
  ctx.restore();
}

function dot(x, y, r, color) {
  // draw at the wrapped position, plus a copy when straddling an edge
  const W = COLS, H = ROWS;
  const wx = ((x % W) + W) % W, wy = ((y % H) + H) % H;
  ctx.fillStyle = color;
  const xs = [wx], ys = [wy];
  if (wx < r) xs.push(wx + W); else if (wx > W - r) xs.push(wx - W);
  if (wy < r) ys.push(wy + H); else if (wy > H - r) ys.push(wy - H);
  for (const px of xs) for (const py of ys) {
    ctx.beginPath(); ctx.arc(px * cs, py * cs, r * cs, 0, 6.283); ctx.fill();
  }
}

function drawSnake(s) {
  const n = s.body.length;
  const iv = interval(s);
  const a = s.alive ? Math.min(1, s.acc / iv) : 1;
  const R = [];
  for (let i = 0; i < n; i++) {
    const c = s.body[i], p = s.prev[Math.min(i, s.prev.length - 1)];
    let dx = c.x - p.x, dy = c.y - p.y;
    if (dx > COLS / 2) dx -= COLS; else if (dx < -COLS / 2) dx += COLS;
    if (dy > ROWS / 2) dy -= ROWS; else if (dy < -ROWS / 2) dy += ROWS;
    R.push({ x: p.x + 0.5 + dx * a, y: p.y + 0.5 + dy * a });
  }
  for (let i = 1; i < n; i++) {
    const q = R[i - 1], r = R[i];
    while (r.x - q.x > COLS / 2) r.x -= COLS; while (r.x - q.x < -COLS / 2) r.x += COLS;
    while (r.y - q.y > ROWS / 2) r.y -= ROWS; while (r.y - q.y < -ROWS / 2) r.y += ROWS;
  }
  const ghost = s.fx.ghost > 0;
  const base = s.alive ? s.rgb : mix(s.rgb, [120, 130, 130], 0.6);
  const dark = mix(base, [8, 20, 24], 0.55);
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.5 + 0.15 * Math.sin(clock * 8);
  else if (!s.alive) ctx.globalAlpha = 0.45 + 0.4 * Math.abs(Math.sin(clock * 12));

  const stamps = [];
  for (let i = n - 1; i >= 1; i--) {
    for (let k = 0; k < 5; k++) {
      const f = k / 5, u = ((n - 1 - i) + f) / Math.max(1, n - 1);
      stamps.push({
        x: R[i].x + (R[i - 1].x - R[i].x) * f,
        y: R[i].y + (R[i - 1].y - R[i].y) * f,
        r: 0.2 + 0.25 * Math.min(1, u * 3),
        c: rgb(mix(dark, base, 0.3 + 0.7 * u)),
      });
    }
  }
  for (const t of stamps) dot(t.x + 0.03, t.y + 0.08, t.r + 0.05, 'rgba(0,0,0,.35)');
  for (const t of stamps) dot(t.x, t.y, t.r, t.c);
  for (let i = 1; i < n - 1; i++) dot(R[i].x, R[i].y, 0.12, 'rgba(255,255,255,.16)');

  const h = R[0], v = DIRS[s.dir], px = -v[1], py = v[0];
  const hx = ((h.x % COLS) + COLS) % COLS * cs, hy = ((h.y % ROWS) + ROWS) % ROWS * cs;
  ctx.fillStyle = rgb(base);
  ctx.beginPath(); ctx.ellipse(hx, hy, cs * 0.53, cs * 0.45, Math.atan2(v[1], v[0]), 0, 6.283); ctx.fill();
  if (s.alive && Math.sin(clock * 5 + s.tongue) > 0.85) {
    ctx.strokeStyle = '#ff4466'; ctx.lineWidth = cs * 0.06; ctx.lineCap = 'round';
    const bx = hx + v[0] * cs * 0.5, by = hy + v[1] * cs * 0.5, tx = hx + v[0] * cs * 0.88, ty = hy + v[1] * cs * 0.88;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty);
    ctx.moveTo(tx, ty); ctx.lineTo(tx + (v[0] + px) * cs * 0.12, ty + (v[1] + py) * cs * 0.12);
    ctx.moveTo(tx, ty); ctx.lineTo(tx + (v[0] - px) * cs * 0.12, ty + (v[1] - py) * cs * 0.12);
    ctx.stroke();
  }
  for (const side of [-1, 1]) {
    const ex = hx + v[0] * cs * 0.12 + px * side * cs * 0.2, ey = hy + v[1] * cs * 0.12 + py * side * cs * 0.2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, cs * 0.13, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#0a1519';
    if (s.alive) { ctx.beginPath(); ctx.arc(ex + v[0] * cs * 0.04, ey + v[1] * cs * 0.04, cs * 0.07, 0, 6.283); ctx.fill(); }
    else {
      ctx.strokeStyle = '#0a1519'; ctx.lineWidth = cs * 0.035;
      ctx.beginPath(); ctx.moveTo(ex - cs * 0.06, ey - cs * 0.06); ctx.lineTo(ex + cs * 0.06, ey + cs * 0.06);
      ctx.moveTo(ex + cs * 0.06, ey - cs * 0.06); ctx.lineTo(ex - cs * 0.06, ey + cs * 0.06); ctx.stroke();
    }
  }
  if (s.alive) {
    let ring = 0.62;
    const rings = [['slow', '#8fe3ff'], ['double', '#7dffb1'], ['boost', '#ffd23c']];
    for (const [k, col] of rings) {
      if (s.fx[k] <= 0) continue;
      ctx.strokeStyle = col; ctx.globalAlpha = 0.7; ctx.lineWidth = cs * 0.05;
      if (k === 'slow') ctx.setLineDash([cs * 0.12, cs * 0.1]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(hx, hy, cs * ring, 0, 6.283); ctx.stroke();
      ring += 0.12;
    }
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function render() {
  const W = cv.width; if (!W) return;
  ctx.fillStyle = '#0c1a1f'; ctx.fillRect(0, 0, W, W);
  ctx.save();
  if (shake > 0) { const m = shake * cs * 0.4; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  ctx.drawImage(bg, 0, 0);
  for (const r of rocks) drawRock(r);
  for (const it of items) drawItem(it);
  for (const s of snakes) drawSnake(s);
  for (const p of particles) {
    const t = 1 - p.life / p.max;
    ctx.globalAlpha = Math.max(0, t); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * cs, p.y * cs, Math.max(0.5, p.size * cs * (0.5 + t * 0.5)), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const t = p.t / 0.95;
    ctx.globalAlpha = Math.max(0, 1 - t * t);
    ctx.fillStyle = p.color;
    ctx.font = (p.big ? '800 ' + cs * 1.1 : '500 ' + cs * 0.62) + "px 'DM Mono', monospace";
    ctx.fillText(p.text, p.x * cs, (p.y - t * (p.big ? 0.8 : 1.3)) * cs);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- main loop ---------- */
let last = 0, hudT = 0;
function tick(dt) {
  if (state === 'count') {
    countT -= dt;
    const n = Math.ceil(countT);
    if (n !== lastCount) { lastCount = n; if (n > 0) { setCount(n); sfx('beep'); } }
    if (countT <= 0) { state = 'play'; setCount('GO'); goT = 0.55; sfx('go'); }
  } else if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'ending') {
    endT -= dt;
    if (endT <= 0) showOver();
  }
  if (goT > 0) { goT -= dt; if (goT <= 0 && state === 'play') countEl.hidden = true; }
  if (state !== 'paused') updateParticles(dt);
  shake = Math.max(0, shake - dt);
  hudT -= dt;
  if (hudT <= 0) { hudT = 0.08; updateHud(); syncFx(); }
}
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; clock += dt;
  tick(dt); render();
  requestAnimationFrame(frame);
}

/* ---------- pickup key ---------- */
(function buildKey() {
  const svg = (inner) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
  const rows = [
    ['<circle cx="12" cy="13" r="7" fill="#ff4466"/><path d="M12 6l1-3" stroke="#6b4a2b" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="16" cy="4.5" rx="3" ry="1.6" fill="#7fd35b"/>', 'Berry', '+10 points and one segment of growth.'],
    [svg2('gold', '#ffc93c'), 'Golden berry', '+50 points and three segments. Gone after 8 seconds.'],
  ];
  function svg2(k, color) {
    const ic = ICONS[k];
    if (ic.mode === 'text') return '<text x="12" y="17" text-anchor="middle" font-size="13" font-weight="800" fill="' + color + '">' + ic.text + '</text>';
    if (ic.mode === 'stroke') return '<path d="' + ic.d + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
    return '<path d="' + ic.d + '" fill="' + color + '"' + (ic.rule ? ' fill-rule="' + ic.rule + '"' : '') + '/>';
  }
  for (const k of POWER_KEYS) rows.push([svg2(k, POWER[k].color), POWER[k].name, POWER[k].desc]);
  $('#key').innerHTML = rows.map((r) => '<li>' + svg(r[0]) + '<span><b>' + r[1] + '</b>' + r[2] + '</span></li>').join('');
})();

$('#btn-sound').textContent = cfg.mute ? 'Sound off' : 'Sound on';
resize();
showMenu();
requestAnimationFrame(frame);
})();
</script>
