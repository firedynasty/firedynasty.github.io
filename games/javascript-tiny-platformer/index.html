<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-type" content="text/html; charset=utf-8"/>
  <title>Javascript Platformer</title>

  <style>
    body            { background: #111; }
    #platformer     { margin: 1em auto; position: relative; width: 512px; height: 384px; }
    #canvas         { display: inline-block; width: 100%; height: 100%; }
    #instructions   { font-style: italic; color: #999; font-size: 9pt; margin-left: 1em; margin-top: 0.5em; }
    #instructions b { color: #DDD; }
    #instructions a, .levels a { color: #9cf; }
    .levels { font-style: italic; color: #999; font-size: 9pt; margin-left: 1em; margin-top: 0.5em; }
    .levels b { color: #DDD; }
    #instructions button { float: right; margin-left: 0.5em; cursor: pointer; }
    #pauseMsg       { display: none; position: absolute; top: 35%; left: 0; right: 0; text-align: center; color: #fff; font-size: 3em; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    #pauseMsg small { font-size: 0.4em; font-weight: normal; }
    @media screen and (min-width:     0px) and (min-height:    0px) { #platformer { width:  512px; height: 384px; font-size:  7pt; } } /* block = 16 */
    @media screen and (min-width:   840px) and (min-height:  530px) { #platformer { width:  640px; height: 480px; font-size:  9pt; } } /* block = 20 */
    @media screen and (min-width:   968px) and (min-height:  626px) { #platformer { width:  768px; height: 576px; font-size: 11pt; } } /* block = 24 */
    @media screen and (min-width:  1096px) and (min-height:  722px) { #platformer { width:  896px; height: 672px; font-size: 13pt; } } /* block = 28 */
    @media screen and (min-width:  1224px) and (min-height:  818px) { #platformer { width: 1024px; height: 768px; font-size: 15pt; } } /* block = 32 */
  </style>

</head>

<body>

  <div id="platformer">

    <canvas id="canvas">
      <div class="unsupported">
        Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
      </div>
    </canvas>

    <div id="pauseMsg">PAUSED<br><small>Esc / Enter to resume</small></div>

    <div id="instructions">
      <button id="demoBtn">DEMO</button>
      <button id="pauseBtn">PAUSE</button>
      <b>LEFT/RIGHT</b> to move, <b>SPACE</b> to jump, collect gold and jump on monsters.
      <b>Esc / Enter</b>: pause. <b>R</b>: restart. <b>T</b>: demo.
    </div>

    <div class="levels">
      <b>Levels:</b> <a href="?">original</a>
      <span id="levelLinks"></span>
    </div>

  </div>

  <script src="thomas-levels.js"></script>
  <script>
    (function() {
      var box = document.getElementById('levelLinks'), cur = (/[?&]level=(\d+)/.exec(location.search) || [])[1];
      (window.THOMAS_LEVELS || []).forEach(function(l) {
        var a = document.createElement('a');
        a.href = '?level=' + l.n;
        a.textContent = l.title;
        if (String(l.n) === cur) a.style.fontWeight = 'bold';
        box.appendChild(document.createTextNode(' | '));
        box.appendChild(a);
      });
    })();
  </script>
  <script src="fpsmeter.min.js"></script>
  <script src="platformer.js"></script>

</body>
</html>
