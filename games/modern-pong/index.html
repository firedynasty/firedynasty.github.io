<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>Modern Pong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;900&display=swap">
<style>
/* Layout: one centered column. Wordmark and mode controls on top, a 16:10 court in the middle, live readouts underneath.
   Single dark look by choice: indigo court, coral paddle for the player, mint paddle for the opponent. */
:root{
  --ground:#0b0f1f;
  --court:#10152b;
  --line:#2b3367;
  --ink:#eceefb;
  --muted:#9097bf;
  --you:#ff7a59;
  --cpu:#5eead4;
  --ball:#fbf7ef;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ground)}
body{margin:0;padding-inline:16px;padding-block:20px 28px;color:var(--ink);font:500 16px/1.4 var(--body)}
.app{max-width:940px;margin:0 auto;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.mark{margin:0;display:flex;align-items:center;gap:12px;font:900 38px/1 var(--display);letter-spacing:.1em}
.mark i{display:block;width:6px;height:26px;border-radius:3px}
.mark .a{background:var(--you)}
.mark .b{background:var(--cpu)}
.controls{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--court)}
button{font:inherit;color:inherit}
.seg button,.toggle{appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 13px;min-height:36px;border-radius:7px;font-weight:600;font-size:15px;cursor:pointer}
.seg button:hover,.toggle:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.toggle{border:1px solid var(--line);background:var(--court);border-radius:10px;padding-inline:14px}
.toggle:disabled{opacity:.4;cursor:default}
.toggle:disabled:hover{color:var(--muted)}
button:focus-visible{outline:2px solid var(--cpu);outline-offset:2px}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--court);box-shadow:0 28px 70px -36px rgba(94,234,212,.3)}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;touch-action:none}
.stage.live canvas{cursor:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:rgba(11,15,31,.58);backdrop-filter:blur(3px);cursor:pointer}
.kicker{margin:0;font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.title{margin:0;font:900 clamp(48px,13vw,128px)/.9 var(--display);letter-spacing:.05em;text-wrap:balance}
.hint{margin:0;max-width:42ch;color:var(--muted);font-size:16px;text-wrap:pretty}
.primary{margin-top:6px;appearance:none;border:0;background:var(--you);color:#1c0e09;font-weight:700;font-size:18px;letter-spacing:.05em;padding:12px 32px;border-radius:10px;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.readout{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px}
.stats{display:flex;flex-wrap:wrap;gap:12px 30px}
.stat{display:grid;gap:3px;min-width:0}
.stat span{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 30px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.keys{margin:0;max-width:50ch;font-size:14px;color:var(--muted);text-wrap:pretty}
@media (max-width:520px){
  .mark{font-size:32px}
  .stat b{font-size:26px}
  .hint{display:none}
  .primary{padding:10px 26px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){.overlay{backdrop-filter:none}}
</style>

</head>
<body>
<main class="app">
  <header class="bar">
    <h1 class="mark"><i class="a"></i>PONG<i class="b"></i></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Players">
        <button type="button" data-mode="1" aria-pressed="true">1 Player</button>
        <button type="button" data-mode="2" aria-pressed="false">2 Players</button>
      </div>
      <div class="seg" id="diffSeg" role="group" aria-label="Difficulty">
        <button type="button" data-diff="easy" aria-pressed="false">Easy</button>
        <button type="button" data-diff="medium" aria-pressed="true">Medium</button>
        <button type="button" data-diff="hard" aria-pressed="false">Hard</button>
      </div>
      <div class="seg" role="group" aria-label="Ball speed">
        <button type="button" data-ball="normal" aria-pressed="true">Normal ball</button>
        <button type="button" data-ball="fast" aria-pressed="false">Fast ball</button>
      </div>
      <button type="button" class="toggle" id="pauseBtn" disabled>Pause</button>
      <button type="button" class="toggle" id="soundBtn" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="court" role="img" aria-label="Pong court. The player paddle is on the left, the opponent on the right."></canvas>
    <div class="overlay" id="overlay">
      <p class="kicker" id="ovKicker">First to 7</p>
      <h2 class="title" id="ovTitle">Pong</h2>
      <p class="hint" id="ovHint"></p>
      <button type="button" class="primary" id="startBtn">Serve</button>
    </div>
  </section>

  <footer class="readout">
    <div class="stats">
      <div class="stat"><span>Rally</span><b id="statRally">0</b></div>
      <div class="stat"><span>Best rally</span><b id="statBest">0</b></div>
      <div class="stat"><span>Ball speed</span><b id="statSpeed">&mdash;</b></div>
    </div>
    <p class="keys" id="keysHint"></p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var W = 800, H = 500, STEP = 1 / 120;
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- colors from the CSS tokens ---------- */
  var rs = getComputedStyle(document.documentElement);
  function tok(n, fb) { return (rs.getPropertyValue(n).trim() || fb); }
  var col = {
    court: tok('--court', '#10152b'), line: tok('--line', '#2b3367'), ink: tok('--ink', '#eceefb'),
    muted: tok('--muted', '#9097bf'), you: tok('--you', '#ff7a59'), cpu: tok('--cpu', '#5eead4'), ball: tok('--ball', '#fbf7ef')
  };
  function rgba(hex, a) {
    var n = parseInt(hex.replace('#', ''), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  var FONT = '"Big Shoulders Display","Arial Narrow",Impact,sans-serif';
  var BODY = '"Barlow Semi Condensed","Arial Narrow",sans-serif';

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------- elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('court'), ctx = canvas.getContext('2d');
  var stage = $('stage'), overlay = $('overlay');
  var ovKicker = $('ovKicker'), ovTitle = $('ovTitle'), ovHint = $('ovHint'), startBtn = $('startBtn');
  var pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn'), diffSeg = $('diffSeg'), keysHint = $('keysHint');
  var statRally = $('statRally'), statBest = $('statBest'), statSpeed = $('statSpeed');

  /* ---------- game data ---------- */
  var PAD = { w: 12, h: 84, inset: 26 };
  var BALL = { r: 8, base: 400, max: 980 };
  var BALL_MODES = { normal: { base: 400, max: 980, ai: 1 }, fast: { base: 580, max: 1300, ai: 1.4 } };
  var ballMode = 'normal';
  function applyBallMode(m) {
    ballMode = m; BALL.base = BALL_MODES[m].base; BALL.max = BALL_MODES[m].max;
  }
  var DIFF = {
    easy:   { speed: 300, err: 80, react: 0.22, predict: false },
    medium: { speed: 430, err: 40, react: 0.13, predict: true },
    hard:   { speed: 600, err: 14, react: 0.07, predict: true }
  };

  var S = {
    mode: '1', diff: 'medium', phase: 'attract', prev: 'play',
    scoreL: 0, scoreR: 0, winScore: 7,
    rally: 0, best: 0, live: false, serveT: 0.6, serveDir: 1, lastHitter: 0,
    shake: 0, hitstop: 0, time: 0, pulse: [0, 0], flash: null
  };
  try { S.best = parseInt(localStorage.getItem('pong.best'), 10) || 0; } catch (e) {}

  var L = { x: PAD.inset, y: H / 2, vy: 0, flash: 0, target: null, aiOn: true, aiT: 0, aim: H / 2 };
  var R = { x: W - PAD.inset - PAD.w, y: H / 2, vy: 0, flash: 0, target: null, aiOn: true, aiT: 0, aim: H / 2 };
  var b = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
  var trail = [], parts = [];

  /* ---------- sound ---------- */
  var actx = null, muted = false;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
  }
  function tone(f1, f2, dur, type, vol) {
    if (muted || !actx || S.phase === 'attract') return;
    try {
      var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function sfxPaddle() { tone(380 + Math.min(S.rally, 24) * 16, null, 0.07, 'square', 0.05); }
  function sfxWall() { tone(210, null, 0.05, 'triangle', 0.08); }
  function sfxLaunch() { tone(300, 600, 0.09, 'triangle', 0.05); }
  function sfxScore(good) { tone(good ? 330 : 260, good ? 660 : 90, 0.32, 'sawtooth', 0.05); }
  function sfxWin() {
    [523, 659, 784, 1047].forEach(function (f, i) {
      setTimeout(function () { tone(f, null, 0.16, 'triangle', 0.07); }, i * 110);
    });
  }

  /* ---------- effects ---------- */
  function burst(x, y, n, color, speed, life, dir, spread) {
    if (reduce) n = Math.ceil(n / 3);
    for (var i = 0; i < n; i++) {
      var a = dir === undefined ? rand(0, Math.PI * 2) : dir + rand(-spread, spread);
      var v = speed * rand(0.3, 1);
      var l = life * rand(0.6, 1.2);
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: l, max: l, c: color, s: rand(1.5, 4) });
    }
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  }
  function kick(a) { if (!reduce) S.shake = Math.max(S.shake, a); }

  /* ---------- state changes ---------- */
  function resetBall() {
    b.x = W / 2; b.y = H / 2; b.vx = 0; b.vy = 0;
    S.live = false; S.lastHitter = 0; trail.length = 0;
  }
  function setAI() {
    L.aiOn = S.phase === 'attract';
    R.aiOn = S.phase === 'attract' || S.mode === '1';
  }
  function saveBest() { try { localStorage.setItem('pong.best', String(S.best)); } catch (e) {} }

  function overlayShow(kind) {
    overlay.hidden = false;
    stage.classList.remove('live');
    var hint = 'The ball speeds up on every return. Where it meets the paddle decides the angle.';
    if (kind === 'attract') {
      ovKicker.textContent = 'First to ' + S.winScore;
      ovTitle.textContent = 'Pong';
      ovHint.textContent = hint;
      startBtn.textContent = 'Serve';
    } else if (kind === 'paused') {
      ovKicker.textContent = 'Paused';
      ovTitle.textContent = 'Hold on';
      ovHint.textContent = 'Press Space or tap to pick the rally back up.';
      startBtn.textContent = 'Resume';
    }
  }
  function overlayHide() { overlay.hidden = true; stage.classList.add('live'); }

  function toAttract() {
    S.phase = 'attract'; S.scoreL = 0; S.scoreR = 0; S.rally = 0;
    S.serveT = 0.6; S.serveDir = Math.random() < 0.5 ? 1 : -1; S.flash = null;
    resetBall(); setAI(); overlayShow('attract'); syncPause();
  }
  function startMatch() {
    S.phase = 'play'; S.scoreL = 0; S.scoreR = 0; S.rally = 0;
    S.serveT = 1.0; S.serveDir = Math.random() < 0.5 ? 1 : -1; S.flash = null;
    L.y = R.y = H / 2; L.target = R.target = null;
    resetBall(); setAI(); overlayHide(); syncPause();
  }
  function pause() {
    if (S.phase !== 'play') return;
    S.phase = 'paused'; overlayShow('paused'); syncPause();
  }
  function resume() {
    if (S.phase !== 'paused') return;
    S.phase = 'play'; overlayHide(); syncPause();
  }
  function primary() {
    ensureAudio();
    if (S.phase === 'attract' || S.phase === 'over') startMatch();
    else if (S.phase === 'paused') resume();
  }
  function toggleSpace() {
    if (S.phase === 'play') pause();
    else primary();
  }
  function syncPause() {
    pauseBtn.disabled = !(S.phase === 'play' || S.phase === 'paused');
    pauseBtn.textContent = S.phase === 'paused' ? 'Resume' : 'Pause';
  }

  function launch() {
    var a = rand(-0.45, 0.45);
    var sp = BALL.base;
    b.vx = S.serveDir * Math.cos(a) * sp;
    b.vy = Math.sin(a) * sp;
    S.live = true; S.lastHitter = 0;
    sfxLaunch();
  }

  function endMatch(side) {
    S.phase = 'over'; S.live = false; syncPause();
    overlay.hidden = false; stage.classList.remove('live');
    var one = S.mode === '1';
    ovKicker.textContent = 'Final · ' + S.scoreL + ' – ' + S.scoreR;
    ovTitle.textContent = side === 1 ? (one ? 'You win' : 'Player 1 wins') : (one ? 'CPU wins' : 'Player 2 wins');
    ovHint.textContent = one && side === 2 ? 'Drop the difficulty a notch, or take the next one.' : 'Nice finish.';
    startBtn.textContent = 'Play again';
    var wx = side === 1 ? 180 : 620, wc = side === 1 ? col.you : col.cpu;
    burst(wx, 200, 70, wc, 420, 1.1);
    burst(wx, 300, 50, col.ball, 320, 1.0);
    sfxWin();
  }

  function score(side) {
    if (side === 1) S.scoreL++; else S.scoreR++;
    S.pulse[side - 1] = 1;
    if (S.phase === 'play' && S.rally > S.best) { S.best = S.rally; saveBest(); }
    var gx = side === 1 ? W - 6 : 6, gc = side === 1 ? col.you : col.cpu;
    S.flash = { x: side === 1 ? W : 0, c: gc, a: 1 };
    burst(gx, clamp(b.y, 20, H - 20), 46, gc, 380, 0.8, side === 1 ? Math.PI : 0, 1.2);
    kick(10);
    var good = S.mode === '2' || side === 1;
    sfxScore(good);
    S.rally = 0;
    resetBall();
    if (S.phase === 'attract') {
      if (S.scoreL >= S.winScore || S.scoreR >= S.winScore) { S.scoreL = 0; S.scoreR = 0; }
      S.serveDir = side === 1 ? 1 : -1; S.serveT = 0.9;
    } else if (S.scoreL >= S.winScore || S.scoreR >= S.winScore) {
      endMatch(side);
    } else {
      S.serveDir = side === 1 ? 1 : -1; S.serveT = 1.1;
    }
  }

  /* ---------- input ---------- */
  var keys = {};
  function inputFor(p) {
    if (p === L) return [keys.w || (S.mode === '1' && keys.arrowup), keys.s || (S.mode === '1' && keys.arrowdown)];
    return [S.mode === '2' && keys.arrowup, S.mode === '2' && keys.arrowdown];
  }
  window.addEventListener('keydown', function (e) {
    ensureAudio();
    var k = (e.key || '').toLowerCase();
    var onButton = e.target && e.target.tagName === 'BUTTON';
    if (onButton && (k === ' ' || k === 'enter')) return;
    if (k === ' ' || k === 'arrowup' || k === 'arrowdown') e.preventDefault();
    if (!e.repeat) {
      if (k === ' ' || k === 'p' || k === 'enter') toggleSpace();
      else if (k === 'escape') pause();
    }
    keys[k] = true;
  });
  window.addEventListener('keyup', function (e) { keys[(e.key || '').toLowerCase()] = false; });
  window.addEventListener('blur', function () { keys = {}; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });

  function pointer(e) {
    var r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var x = (e.clientX - r.left) / r.width * W;
    var y = (e.clientY - r.top) / r.height * H;
    var p = (S.mode === '2' && x > W / 2) ? R : L;
    p.target = y;
  }
  canvas.addEventListener('pointermove', pointer);
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pointer(e);
  });

  overlay.addEventListener('click', primary);
  pauseBtn.addEventListener('click', function () {
    ensureAudio();
    if (S.phase === 'play') pause(); else resume();
    pauseBtn.blur();
  });
  soundBtn.addEventListener('click', function () {
    ensureAudio();
    muted = !muted;
    soundBtn.setAttribute('aria-pressed', String(!muted));
    soundBtn.textContent = muted ? 'Sound off' : 'Sound on';
    soundBtn.blur();
  });

  function syncControls() {
    document.querySelectorAll('[data-mode]').forEach(function (el) {
      el.setAttribute('aria-pressed', String(el.getAttribute('data-mode') === S.mode));
    });
    document.querySelectorAll('[data-diff]').forEach(function (el) {
      el.setAttribute('aria-pressed', String(el.getAttribute('data-diff') === S.diff));
    });
    document.querySelectorAll('[data-ball]').forEach(function (el) {
      el.setAttribute('aria-pressed', String(el.getAttribute('data-ball') === ballMode));
    });
    diffSeg.hidden = S.mode === '2';
    keysHint.textContent = S.mode === '1'
      ? 'Steer with the mouse, a finger, W / S or the arrow keys. Space pauses.'
      : 'Player 1: W / S or the left half of the screen. Player 2: ↑ / ↓ or the right half. Space pauses.';
  }
  document.querySelectorAll('[data-mode]').forEach(function (el) {
    el.addEventListener('click', function () {
      ensureAudio(); S.mode = el.getAttribute('data-mode'); syncControls(); toAttract(); el.blur();
    });
  });
  document.querySelectorAll('[data-ball]').forEach(function (el) {
    el.addEventListener('click', function () {
      ensureAudio(); applyBallMode(el.getAttribute('data-ball')); syncControls(); toAttract(); el.blur();
    });
  });
  document.querySelectorAll('[data-diff]').forEach(function (el) {
    el.addEventListener('click', function () {
      ensureAudio(); S.diff = el.getAttribute('data-diff'); syncControls(); toAttract(); el.blur();
    });
  });

  /* ---------- simulation ---------- */
  function predictY(p) {
    var px = p === R ? p.x : p.x + PAD.w;
    var t = (px - b.x) / b.vx;
    var y = b.y + b.vy * t;
    var span = H - 2 * BALL.r;
    y = (((y - BALL.r) % (2 * span)) + 2 * span) % (2 * span);
    if (y > span) y = 2 * span - y;
    return y + BALL.r;
  }
  function aiMove(p, dt) {
    var cfg = S.phase === 'attract' ? DIFF.medium : DIFF[S.diff];
    p.aiT -= dt;
    var toward = S.live && (p === R ? b.vx > 0 : b.vx < 0);
    if (p.aiT <= 0) {
      p.aiT = cfg.react;
      if (toward) {
        var y = cfg.predict ? predictY(p) : b.y;
        p.aim = y + rand(-1, 1) * cfg.err;
      } else {
        p.aim = H / 2 + rand(-1, 1) * 40;
      }
    }
    var d = p.aim - p.y;
    if (Math.abs(d) > 5) p.y += Math.sign(d) * Math.min(Math.abs(d), cfg.speed * BALL_MODES[ballMode].ai * dt);
  }
  function movePaddle(p, dt, up, down) {
    var prev = p.y;
    if (p.aiOn) {
      aiMove(p, dt);
    } else {
      var dir = (down ? 1 : 0) - (up ? 1 : 0);
      if (dir) { p.y += dir * 620 * dt; p.target = null; }
      else if (p.target !== null) { p.y += (p.target - p.y) * Math.min(1, 22 * dt); }
    }
    p.y = clamp(p.y, PAD.h / 2, H - PAD.h / 2);
    p.vy = (p.y - prev) / dt;
    p.flash = Math.max(0, p.flash - dt * 4);
  }
  function hitCheck(p, side) {
    var top = p.y - PAD.h / 2, bot = p.y + PAD.h / 2;
    if (b.y + BALL.r < top || b.y - BALL.r > bot) return;
    if (b.x + BALL.r < p.x || b.x - BALL.r > p.x + PAD.w) return;
    if (side === 1 && b.x < p.x) return;
    if (side === 2 && b.x > p.x + PAD.w) return;

    var off = clamp((b.y - p.y) / (PAD.h / 2 + BALL.r), -1, 1);
    var dir = side === 1 ? 1 : -1;
    var sp = Math.min(BALL.max, Math.hypot(b.vx, b.vy) * 1.045 + 6);
    var ang = off * 0.95;
    var vx = dir * Math.cos(ang) * sp;
    var vy = Math.sin(ang) * sp + clamp(p.vy, -900, 900) * 0.08;
    var m = Math.hypot(vx, vy);
    b.vx = vx * sp / m; b.vy = vy * sp / m;
    b.x = side === 1 ? p.x + PAD.w + BALL.r : p.x - BALL.r;

    p.flash = 1; S.lastHitter = side;
    if (S.phase === 'play') S.rally++;
    sfxPaddle();
    var hc = side === 1 ? col.you : col.cpu;
    burst(b.x, b.y, 14, hc, 260, 0.4, side === 1 ? 0 : Math.PI, 1.1);
    kick(2 + (sp / BALL.max) * 3);
    if (sp > 650) S.hitstop = 0.03;
  }
  function step(dt) {
    S.time += dt;
    var pair = [L, R];
    for (var i = 0; i < 2; i++) { var io = inputFor(pair[i]); movePaddle(pair[i], dt, io[0], io[1]); }
    if (S.phase === 'over') return;
    if (!S.live) {
      S.serveT -= dt;
      if (S.serveT <= 0) launch();
      return;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < BALL.r) { b.y = BALL.r; b.vy = Math.abs(b.vy); sfxWall(); burst(b.x, 2, 6, col.line, 120, 0.3, Math.PI / 2, 0.9); }
    else if (b.y > H - BALL.r) { b.y = H - BALL.r; b.vy = -Math.abs(b.vy); sfxWall(); burst(b.x, H - 2, 6, col.line, 120, 0.3, -Math.PI / 2, 0.9); }
    if (b.vx < 0) hitCheck(L, 1); else hitCheck(R, 2);
    if (b.x < -BALL.r * 2) score(2);
    else if (b.x > W + BALL.r * 2) score(1);
  }
  function updateFx(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      var k = Math.pow(0.03, dt);
      p.vx *= k; p.vy *= k;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    S.shake *= Math.pow(0.0008, dt);
    if (S.shake < 0.15) S.shake = 0;
    S.pulse[0] = Math.max(0, S.pulse[0] - dt * 3);
    S.pulse[1] = Math.max(0, S.pulse[1] - dt * 3);
    if (S.flash) { S.flash.a -= dt * 2.4; if (S.flash.a <= 0) S.flash = null; }
    if (S.live) { trail.push({ x: b.x, y: b.y }); if (trail.length > 16) trail.shift(); }
    else if (trail.length) trail.length = 0;
  }

  /* ---------- drawing ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function labels() {
    if (S.phase === 'attract') return ['CPU', 'CPU'];
    return S.mode === '1' ? ['YOU', 'CPU · ' + S.diff.toUpperCase()] : ['P1', 'P2'];
  }
  function drawPaddle(p, c) {
    var y = p.y - PAD.h / 2;
    ctx.save();
    ctx.shadowColor = c;
    ctx.shadowBlur = (reduce ? 6 : 16) + p.flash * 24;
    ctx.fillStyle = c;
    rr(p.x, y, PAD.w, PAD.h, 6); ctx.fill();
    ctx.restore();
    if (p.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (p.flash * 0.65) + ')';
      rr(p.x, y, PAD.w, PAD.h, 6); ctx.fill();
    }
  }
  function draw() {
    var s = canvas.width / W, g, i;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = col.court; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, 0, W * 0.45, 0);
    g.addColorStop(0, rgba(col.you, 0.08)); g.addColorStop(1, rgba(col.you, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(W, 0, W * 0.55, 0);
    g.addColorStop(0, rgba(col.cpu, 0.08)); g.addColorStop(1, rgba(col.cpu, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (S.shake > 0) ctx.translate(rand(-0.5, 0.5) * S.shake, rand(-0.5, 0.5) * S.shake);

    if (S.flash) {
      var fx = S.flash.x, dirx = fx === 0 ? 1 : -1;
      g = ctx.createLinearGradient(fx, 0, fx + dirx * 170, 0);
      g.addColorStop(0, rgba(S.flash.c, 0.4 * S.flash.a)); g.addColorStop(1, rgba(S.flash.c, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // court markings
    ctx.strokeStyle = col.line; ctx.lineWidth = 3;
    ctx.setLineDash([10, 14]);
    ctx.beginPath(); ctx.moveTo(W / 2, 16); ctx.lineTo(W / 2, H - 16); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 62, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col.line; ctx.fillRect(0, 0, W, 3); ctx.fillRect(0, H - 3, W, 3);

    // scores
    var lb = labels();
    var items = [[S.scoreL, W * 0.25, col.you, S.pulse[0], lb[0]], [S.scoreR, W * 0.75, col.cpu, S.pulse[1], lb[1]]];
    ctx.textAlign = 'center';
    for (i = 0; i < 2; i++) {
      var it = items[i];
      ctx.font = '900 ' + (150 + it[3] * 26) + 'px ' + FONT;
      ctx.fillStyle = rgba(it[2], 0.2 + it[3] * 0.25);
      ctx.fillText(String(it[0]), it[1], 162);
      ctx.font = '600 14px ' + BODY;
      try { ctx.letterSpacing = '4px'; } catch (e) {}
      ctx.fillStyle = rgba(it[2], 0.78);
      ctx.fillText(it[4], it[1], 196);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
    }

    // trail
    var tc = S.lastHitter === 1 ? col.you : S.lastHitter === 2 ? col.cpu : col.ball;
    for (i = 0; i < trail.length; i++) {
      var a = (i + 1) / trail.length;
      ctx.fillStyle = rgba(tc, a * 0.32);
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, BALL.r * (0.35 + 0.65 * a), 0, Math.PI * 2); ctx.fill();
    }

    drawPaddle(L, col.you);
    drawPaddle(R, col.cpu);

    // ball
    if (S.phase !== 'over') {
      var vis = S.live ? 1 : clamp((0.7 - S.serveT) / 0.5, 0, 1);
      if (vis > 0) {
        ctx.save();
        ctx.translate(b.x, b.y);
        if (S.live) {
          var sp = Math.hypot(b.vx, b.vy);
          var st = 1 + Math.min(0.45, (sp / BALL.base - 1) * 0.25 + 0.05);
          ctx.rotate(Math.atan2(b.vy, b.vx));
          ctx.scale(st, 1 / Math.sqrt(st));
        }
        var r = BALL.r * vis * (S.live ? 1 : 1 + Math.sin(S.time * 9) * 0.07);
        ctx.shadowColor = tc; ctx.shadowBlur = 18;
        ctx.fillStyle = col.ball;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (!S.live && S.phase === 'play' && vis > 0.6) {
          ctx.strokeStyle = rgba(col.ball, 0.5); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
          for (i = 0; i < 2; i++) {
            var x0 = b.x + S.serveDir * (26 + i * 12);
            ctx.beginPath();
            ctx.moveTo(x0 - S.serveDir * 4, b.y - 7);
            ctx.lineTo(x0 + S.serveDir * 3, b.y);
            ctx.lineTo(x0 - S.serveDir * 4, b.y + 7);
            ctx.stroke();
          }
        }
      }
    }

    // particles
    for (i = 0; i < parts.length; i++) {
      var q = parts[i];
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------- readouts ---------- */
  var shown = { r: '', b: '', s: '' };
  function updateDom() {
    var r = String(S.rally), bs = String(S.best);
    var sp = S.live && S.phase === 'play' ? (Math.hypot(b.vx, b.vy) / BALL.base).toFixed(1) + '×' : '—';
    if (r !== shown.r) { statRally.textContent = r; shown.r = r; }
    if (bs !== shown.b) { statBest.textContent = bs; shown.b = bs; }
    if (sp !== shown.s) { statSpeed.textContent = sp; shown.s = sp; }
  }

  /* ---------- sizing and loop ---------- */
  function resize() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(r.width * dpr));
    var h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  window.addEventListener('resize', resize);

  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (S.phase !== 'paused') {
      if (S.hitstop > 0) { S.hitstop -= dt; dt = 0; }
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      updateFx(dt);
    }
    draw();
    updateDom();
    requestAnimationFrame(frame);
  }

  syncControls();
  toAttract();
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
