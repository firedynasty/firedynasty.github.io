  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; background:var(--panel); color:var(--text); border:1px solid #555; border-radius:6px; padding:10px; font-size:16px; cursor:pointer; }
  button:hover { background:#444; } button.go { background:var(--accent); border-color:var(--accent); color:#111; font-weight:700; }
  .dots { display:flex; gap:4px; margin-top:12px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; } .dot.done { background:var(--accent); } .dot.cur { outline:2px solid #fff; }

"g8f8 e1e8 d7e8 f7e8q","rating":1397,"theme":"mateIn2"},{"id":"4MrGq","fen":"3r3k/pp3p1p/5P2/4N1R1/8/1P4KP/n2p2P1/7r b - - 3 36","moves":"h7h6 e5f7 h8h7 g5g7","rating":1398,"theme":"mateIn2"}];
const LABEL = {mateIn1:'Mate in 1', mateIn2:'Mate in 2', fork:'Find the fork', hangingPiece:'Win material'};
const $ = id => document.getElementById(id);
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

let solved = new Set(store.get('pcp_solved', []));
let idx = 0, game, line, step, flip, sel = null, locked = false, missed = false;

// Puzzles are sorted easiest-first; resume at the first one not yet solved.
function pickStart() {
  const unsolved = PUZZLES.findIndex(p => !solved.has(p.id));
  return unsolved === -1 ? 0 : unsolved;
}

function load(i) {
  idx = i; const p = PUZZLES[idx];
  game = new Chess(p.fen);
  line = p.moves.split(' ');
  step = 0; sel = null; locked = true; missed = false;
  flip = false;
  $('next').style.display = 'none'; $('hint').disabled = false;
  setMsg('');
  render(null);
  // opponent's first move, shown after a beat so the player sees what changed
  setTimeout(() => {
    const m = play(line[step++]);
    flip = game.turn() === 'b';
    render(m); locked = false;
    $('prompt').textContent = (game.turn()==='w' ? 'White' : 'Black') + ' to move — ' + (LABEL[p.theme] || 'Find the best move');
  }, 600);
  $('info').textContent = `Puzzle ${idx+1}/${PUZZLES.length} · rating ${p.rating}`;
  $('score').textContent = `Solved ${solved.size}`;
  dots();
}

function play(uci) {
  return game.move({from:uci.slice(0,2), to:uci.slice(2,4), promotion:uci[4]});
}

function render(last) {
  const b = $('board'); b.innerHTML = '';
  const files = 'abcdefgh';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const rank = flip ? r + 1 : 8 - r, file = flip ? 7 - f : f;
    const name = files[file] + rank;
    const d = document.createElement('div');
    d.className = 'sq ' + ((file + rank) % 2 === 0 ? 'd' : 'l');
    d.dataset.sq = name;
    if (sel === name) d.classList.add('sel');
    if (last && (last.from === name || last.to === name)) d.classList.add('last');
    const pc = game.get(name);
    if (pc) { const im = document.createElement('img'); im.src = `pieces/${pc.color}${pc.type.toUpperCase()}.png`; im.alt = ''; im.draggable = false; d.appendChild(im); }
    d.onclick = () => tap(name);
    b.appendChild(d);
  }
}

function flash(names, cls) {
  names.forEach(n => { const e = document.querySelector(`[data-sq=${n}]`); if (e) e.classList.add(cls); });
}

function setMsg(t, c) { const m = $('msg'); m.textContent = t; m.className = c || ''; }

function tap(name) {
  if (locked) return;
  const pc = game.get(name);
  if (!sel) { if (pc && pc.color === game.turn()) { sel = name; render(null); flash([name],'sel'); } return; }
  if (pc && pc.color === game.turn()) { sel = name; render(null); return; }
  const from = sel, want = line[step];
  sel = null;
  // Any checkmate is accepted on a mating move, even if it isn't the stored one.
  const trial = new Chess(game.fen());
  const mv = trial.move({from, to:name, promotion:'q'});
  if (!mv) { render(null); return; }
  const exact = from + name === want.slice(0,4);
  const altMate = trial.in_checkmate() && step === line.length - 1;
  if (!exact && !altMate) {
    missed = true; render(null); flash([from, name], 'bad'); setMsg('Not quite — try again', 'err');
    setTimeout(() => render(null), 500); return;
  }
  game.move({from, to:name, promotion:mv.promotion}); step++;
  render(mv);
  if (step >= line.length) return done();
  locked = true;
  setTimeout(() => { const m = play(line[step++]); render(m); locked = false; setMsg('Good — keep going', 'good'); }, 450);
}

function done() {
  locked = true;
  if (!missed) { solved.add(PUZZLES[idx].id); store.set('pcp_solved', [...solved]); }
  setMsg(missed ? 'Solved (with a miss) ✓' : 'Solved! ✓', 'good');
  $('next').style.display = ''; $('hint').disabled = true;
  $('score').textContent = `Solved ${solved.size}`; dots();
}

function dots() {
  $('dots').innerHTML = PUZZLES.map((p,i) => `<div class="dot${solved.has(p.id)?' done':''}${i===idx?' cur':''}"></div>`).join('');
}

$('hint').onclick = () => { if (locked || !line[step]) return; missed = true; render(null); flash([line[step].slice(0,2)], 'sel'); setMsg('Move the highlighted piece'); };
$('skip').onclick = () => load((idx + 1) % PUZZLES.length);
$('next').onclick = () => { let n = idx + 1; while (n < PUZZLES.length && solved.has(PUZZLES[n].id)) n++; load(n % PUZZLES.length); };

if (PUZZLES.length) load(pickStart()); else $('prompt').textContent = 'No puzzles loaded.';
</script>
